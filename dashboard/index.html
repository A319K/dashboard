<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DotGothic16&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   COMMAND — a handheld console for one person's week.
   Cream shell, brown ink, four-tone LCD. Everything is drawn
   on a dot grid: no gradients, no blur, no rounded corners.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* the shell — tan case, cream screen, one step darker where things recess */
  --ink:#2C231B; --shell:#E7D8C9; --panel:#FFF4E9; --sunk:#DCCBB9;
  --mid:#6B5A48; --dot:rgba(107,90,72,.15);

  /* sage: everything fixed or not-yet-real — classes, goal marks, met targets */
  --sage:#879183; --sage-lt:#9EAB9A;

  /* pigments — one per lane, used everywhere that lane appears */
  --coursework:#3F6B72; --research:#6E5C7B; --business:#A9762A;
  --side:#A4614C;       --software:#5F7F58; --work:#AE4A28;

  --rec:#AE4A28; --ok:#5F7F58; --warn:#A9762A;

  --display:"DotGothic16",ui-monospace,monospace;
  --label:"Silkscreen",ui-monospace,monospace;
  --body:"Space Grotesk",-apple-system,system-ui,sans-serif;
  --data:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);background:var(--shell);font:15.5px/1.55 var(--body);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);
  background-size:7px 7px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 110px}
::selection{background:var(--ink);color:var(--panel)}
:focus-visible{outline:3px solid var(--rec);outline-offset:2px}
svg{shape-rendering:crispEdges}

/* ── frames ─────────────────────────────────────────── */
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
/* the double rule is reserved for the two windows that take over the screen */
.window{background:var(--panel);border:3px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 6px var(--ink),8px 8px 0 var(--ink)}

/* ── the label across the top of the machine ────────── */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin:0 -22px 26px;padding:13px 22px;background:var(--shell);
  border-bottom:3px solid var(--ink)}
.mark{font:700 15px/1 var(--label);letter-spacing:.14em;display:flex;align-items:center;gap:10px}
.led{width:11px;height:11px;background:var(--sunk);border:2px solid var(--ink);flex:none}
.led.on{background:var(--rec);animation:blink 1.4s steps(1,end) infinite}
@keyframes blink{50%{background:var(--panel)}}
.bar .spread{flex:1}
.stat{font:500 12px/1 var(--data);color:var(--mid);white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.stat b{color:var(--ink);font-weight:500}
.stat.stale b,.stat.stale{color:var(--rec)}

/* ── NOW — the only thing that matters on open ──────── */
.now{padding:30px 32px 26px;position:relative}
.eyebrow{font:700 11px/1 var(--label);letter-spacing:.15em;text-transform:uppercase;
  color:var(--rec);display:flex;align-items:center;gap:9px}
.now h2{font:400 clamp(28px,4.4vw,43px)/1.14 var(--display);margin:16px 0 0;max-width:19ch}
.tape{margin-top:20px;padding:15px 17px;background:var(--sunk);border:3px solid var(--ink);
  border-left-width:10px;border-left-color:var(--c,var(--rec));font-size:16px;max-width:62ch}
.tape .cap{font:700 10.5px/1 var(--label);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink);opacity:.65;display:block;margin-bottom:7px}
.clockwrap{text-align:right;flex:none}
.clock{font:400 45px/1 var(--display);font-variant-numeric:tabular-nums}
.nowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:26px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
/* ten projects need to breathe more than four did */
.acts.wrap{gap:8px}
.acts.wrap button{font-size:13.5px;padding:11px 14px}
.acts.wrap button s{display:block;text-decoration:none;font:700 9.5px/1 var(--label);
  letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-top:4px}

/* ── buttons: physical, they press into their shadow ── */
button,a.btn{font:400 12px/1 var(--label);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  padding:12px 15px 10px;color:var(--ink);background:var(--panel);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
a.btn{display:inline-block;text-decoration:none}
button:hover,a.btn:hover{background:var(--sunk)}
button:active,a.btn:active{transform:translate(3px,3px);box-shadow:none}
button.go{background:var(--rec);color:var(--panel);display:inline-flex;align-items:center;gap:9px}
button.go:hover{background:#8E2D11}
button.go .dot{width:9px;height:9px;background:var(--panel)}
button.sm,a.btn.sm{padding:9px 11px 7px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
button.sm:active,a.btn.sm:active{transform:translate(2px,2px)}
button.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--mid);
  text-decoration:underline;text-underline-offset:3px}
button.quiet:hover{background:transparent;color:var(--ink)}
button.quiet:active{transform:none}

/* ── section tabs ───────────────────────────────────── */
h3.sec{display:flex;align-items:center;gap:11px;margin:40px 0 14px}
h3.sec b{background:var(--ink);color:var(--panel);font:700 11px/1 var(--label);
  letter-spacing:.14em;text-transform:uppercase;padding:8px 11px 6px;font-weight:400}
h3.sec::after{content:"";flex:1;height:3px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px)}
h3.sec button{flex:none}

/* ── SIGNATURE: the week as a dot-matrix readout ────── */
.trace{padding:16px 18px 14px;overflow-x:auto}
.tbody{min-width:660px;position:relative;--off:140px}   /* --off = label column + gap */
.row{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;padding:2px 0}
.row .nm{font:500 12px/1.3 var(--data);color:var(--mid);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.row .nm i{width:9px;height:9px;background:var(--c);border:2px solid var(--ink);flex:none}
.row.live .nm{color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{display:grid;grid-template-columns:repeat(15,1fr);gap:1px}
.day s{height:17px;background:var(--sunk);text-decoration:none;display:block}
.row.fixed .day s{height:11px}
.day s.on{background:var(--c)}
.day s.plan{background:repeating-linear-gradient(45deg,var(--c) 0 2px,transparent 2px 4px)}
.day s.cls{background:var(--c,var(--sage))}
.dayhdr{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
.dayhdr span{font:700 11px/1 var(--label);letter-spacing:.08em;color:var(--mid);
  text-align:center;text-transform:uppercase;padding:5px 0 4px}
.dayhdr span.td{background:var(--ink);color:var(--panel)}
.head{position:absolute;top:24px;bottom:0;width:3px;background:var(--rec);z-index:3}
.head::before{content:"";position:absolute;top:-7px;left:-3px;width:9px;height:9px;background:var(--rec)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;
  border-top:3px solid var(--sunk);font:500 11px/1.6 var(--data);color:var(--mid);letter-spacing:.02em}
.legend b{display:inline-flex;align-items:center;gap:7px;font-weight:400}
.legend i{width:14px;height:11px;background:var(--mid);flex:none}
.legend i.p{background:repeating-linear-gradient(45deg,var(--mid) 0 2px,transparent 2px 4px)}
.legend i.n{width:3px;background:var(--rec)}

/* ── cards ──────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(224px,1fr))}
.card{padding:17px 18px 16px;position:relative}
.card::before{content:"";position:absolute;inset:-3px -3px auto -3px;height:6px;background:var(--c)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:4px}
.card h4{font:400 19px/1.25 var(--display);margin:0}
.tag{font:500 11px/1 var(--data);letter-spacing:.06em;text-transform:uppercase;
  color:var(--mid);white-space:nowrap;padding-top:5px}

/* budget bar — a framed meter, segments are half hours */
.meter{display:grid;grid-auto-flow:column;gap:2px;height:16px;margin-top:15px;padding:2px;
  background:var(--sunk);border:3px solid var(--ink)}
.meter s{background:transparent;text-decoration:none}
.meter s.f{background:var(--c)}
.meter s.g{background:var(--sage)}
.mnum{font:500 11.5px/1 var(--data);color:var(--mid);margin-top:9px;display:flex;
  justify-content:space-between;gap:10px}

.next{margin:14px -10px 0;padding:9px 10px;font-size:14.5px;line-height:1.5;cursor:text;
  border:3px solid transparent}
.next:hover{background:var(--sunk)}
.next:focus{outline:none;background:var(--panel);border-color:var(--ink)}
.next:empty::before{content:"Write the first action for next time";color:var(--mid)}
.flag{margin-top:13px;padding:9px 11px;background:var(--sunk);border-left:6px solid var(--warn);
  font:500 12.5px/1.45 var(--data);display:flex;gap:9px;align-items:flex-start}
/* more than one blocker: the count is the control that reveals the rest */
.flag.more{cursor:pointer}
.flag.more:hover{background:#D3C0AC}
.flag .rest{display:none}
.flag.more.open .rest{display:block}
.flag .rest b{display:block;font-weight:500;margin-top:7px;padding-top:7px;
  border-top:3px solid rgba(107,90,72,.22)}
.flag .cnt{display:inline-block;margin-top:5px;color:var(--ink);opacity:.75;
  text-decoration:underline;text-underline-offset:3px}
.flag.more.open .cnt.shut,.flag .cnt.less{display:none}
.flag.more.open .cnt.less{display:inline-block}

/* ── archived projects ──────────────────────────────── */
.arch{display:grid;gap:8px;margin-top:12px}
.arow{display:flex;align-items:center;gap:12px;padding:10px 13px;background:var(--sunk);
  border:3px solid var(--mid);font-size:14px}
.arow i{width:9px;height:9px;background:var(--c);border:2px solid var(--ink);flex:none}
.arow .rt{margin-left:auto;font:500 11.5px/1 var(--data);color:var(--mid)}
.secbtn{margin-left:auto;padding:7px 10px 5px;font-size:10.5px;box-shadow:2px 2px 0 var(--ink)}

/* ── today ──────────────────────────────────────────── */
.item{display:flex;gap:15px;align-items:center;padding:13px 16px;margin-bottom:10px;
  border-left-width:10px;border-left-color:var(--c)}
.item.done{background:var(--sunk);box-shadow:none}
.item.done .it{text-decoration:line-through;opacity:.6}
.item .tm{font:500 12px/1 var(--data);color:var(--mid);min-width:44px}
.it{font-weight:700;font-size:15.5px}
.ia{color:var(--mid);font-size:13.5px;margin-top:3px;line-height:1.45}

/* ── streaks & deadlines ────────────────────────────── */
.pips{display:flex;gap:6px;margin-top:15px;flex-wrap:wrap}
.pips s{width:27px;height:27px;background:var(--sunk);border:3px solid var(--ink);
  text-decoration:none;display:flex;align-items:center;justify-content:center;
  font:400 11px/1 var(--label);color:var(--mid)}
.pips s.f{background:var(--c)}
.pips s.x{background:repeating-linear-gradient(45deg,var(--sunk) 0 3px,transparent 3px 6px)}
.dl{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.cd{font:400 33px/1 var(--display);white-space:nowrap}
.cd.hot{color:var(--rec)} .cd.soon{color:var(--warn)}

/* ── the cartridge slot ─────────────────────────────── */
.drop{background:var(--sunk);border:3px dashed var(--ink);padding:30px 22px;text-align:center;
  cursor:pointer;display:block;width:100%;box-shadow:none;text-transform:none;
  font:15.5px/1.55 var(--body);letter-spacing:0}
.drop:hover{background:#C2B08A}
.drop:active{transform:none}
.drop.hot{background:var(--panel);border-style:solid;border-color:var(--rec);
  box-shadow:inset 0 0 0 4px var(--sunk)}
.drop svg{width:30px;height:30px;color:var(--ink);margin-bottom:10px}
.drop.hot svg{color:var(--rec)}
.drop strong{display:block;font:400 20px/1.25 var(--display);margin-bottom:7px}
.drop span{color:var(--mid);font-size:13.5px}
.queue{margin-top:14px;border:3px solid var(--ink);background:var(--panel)}
.file{display:flex;align-items:center;gap:13px;padding:11px 14px;
  border-bottom:3px solid var(--sunk)}
.file:last-child{border-bottom:0}
.file .fn{font:500 13.5px/1.3 var(--data);word-break:break-all;flex:1}
.file .fs{font:500 11px/1 var(--data);color:var(--mid);white-space:nowrap}
.note{margin-top:12px;font-size:13.5px;color:var(--mid);line-height:1.55}

/* ── empty states: an instruction, not an apology ───── */
.void{background:var(--sunk);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:21px 22px;color:#6E5D42;font-size:14.5px;line-height:1.6}
.void b{display:block;color:var(--ink);font:400 18px/1.3 var(--display);margin-bottom:7px}
code{font:500 .9em var(--data);background:var(--sunk);padding:2px 5px;color:var(--ink)}

/* ── log ────────────────────────────────────────────── */
.log{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:3px solid var(--sunk)}
.log:last-child{border-bottom:0}
.log i{width:9px;height:9px;background:var(--c);border:2px solid var(--ink);flex:none}
.log .meta{font:400 11px/1 var(--data);color:var(--mid);margin-top:5px;letter-spacing:.02em}
.log .rt{margin-left:auto;font:500 11.5px/1 var(--data);color:var(--mid);white-space:nowrap}

/* ── task drawer ────────────────────────────────────── */
.tbtn{position:relative}
.tbtn s{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 4px;
  background:var(--rec);color:var(--panel);border:2px solid var(--ink);text-decoration:none;
  font:700 10px/16px var(--label);display:flex;align-items:center;justify-content:center}
.veil{position:fixed;inset:0;background:rgba(44,35,27,.4);z-index:50;
  animation:fadein .14s steps(2,end)}
@keyframes fadein{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:51;
  background:var(--panel);border-left:3px solid var(--ink);display:flex;flex-direction:column;
  animation:slide .2s steps(4,end)}
@keyframes slide{from{transform:translateX(100%)}}
.dhead{display:flex;align-items:center;gap:12px;padding:15px 18px;
  border-bottom:3px solid var(--ink);background:var(--ink);color:var(--panel)}
.dhead h2{font:700 12px/1 var(--label);letter-spacing:.14em;margin:0;text-transform:uppercase}
.dhead .x{margin-left:auto;background:transparent;border-color:transparent;box-shadow:none;
  color:var(--panel);padding:4px 8px;font-size:15px}
.dhead .x:hover{background:var(--rec)}
.dbody{flex:1;overflow-y:auto;padding:16px 18px 22px}
.dfoot{border-top:3px solid var(--ink);padding:14px 18px;background:var(--sunk)}

/* ── tasks ──────────────────────────────────────────── */
.tgroup{margin-bottom:20px}
.tgroup h5{display:flex;align-items:center;gap:8px;margin:0 0 9px;
  font:500 11px/1 var(--data);color:var(--mid);letter-spacing:.04em}
.tgroup h5 i{width:9px;height:9px;background:var(--c);border:2px solid var(--ink);flex:none}
.tgroup h5 b{margin-left:auto;font-weight:500;color:var(--mid)}
.donehdr{display:flex;align-items:center;gap:9px;width:100%;margin:22px 0 10px;padding:9px 10px;
  background:var(--sunk);border:3px solid var(--ink);box-shadow:none;justify-content:flex-start;
  font:700 10.5px/1 var(--label);letter-spacing:.1em}
.donehdr:active{transform:none}
.donehdr s{margin-left:auto;text-decoration:none;color:var(--mid);font-weight:400}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;margin-bottom:7px;
  background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  cursor:grab}
.task:active{cursor:grabbing}
.task.dragging{opacity:.4}
.task.gone{background:var(--sunk);box-shadow:none;border-color:var(--mid)}
.task.gone .tt{text-decoration:line-through;color:var(--mid)}
.tick{width:22px;height:22px;flex:none;margin-top:1px;padding:0;background:var(--sunk);
  border:3px solid var(--ink);box-shadow:none;color:var(--ink);font:700 12px/1 var(--label);
  display:flex;align-items:center;justify-content:center}
.tick:active{transform:none}
.tick[aria-pressed=true]{background:var(--ok);color:var(--panel)}
.tt{font-size:14.5px;line-height:1.4;font-weight:500}
.tfa{font-size:12.5px;color:var(--mid);line-height:1.45;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font:500 10.5px/1 var(--data);padding:4px 6px 3px;background:var(--sunk);color:var(--mid)}
.chip.due{background:var(--warn);color:var(--panel)}
.chip.hot{background:var(--rec);color:var(--panel)}
.chip.sch{background:var(--sage);color:var(--panel)}
.tdel{margin-left:auto;background:transparent;border-color:transparent;box-shadow:none;
  color:var(--mid);padding:2px 5px;font-size:13px;line-height:1}
.tdel:hover{background:var(--rec);color:var(--panel)}
.tdel.armed{background:var(--rec);color:var(--panel);font:700 9px/1 var(--label);
  letter-spacing:.06em;padding:5px 6px 4px}
.tadd{display:grid;gap:8px}
.tadd .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tadd input,.tadd select{padding:9px 11px;font-size:14px}

/* ── planner ────────────────────────────────────────── */
.pbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;
  padding-bottom:14px;border-bottom:3px solid var(--ink)}
.pbar h1{font:400 22px/1 var(--display);margin:0}
.plan{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pday{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  min-height:230px;display:flex;flex-direction:column}
.pday.today{box-shadow:3px 3px 0 var(--rec)}
.pday.over{background:var(--sunk);border-color:var(--rec);box-shadow:inset 0 0 0 3px var(--rec)}
.pday h6{margin:0;padding:8px 9px 6px;background:var(--sunk);border-bottom:3px solid var(--ink);
  font:700 11px/1 var(--label);letter-spacing:.06em;display:flex;justify-content:space-between}
.allday{padding:5px 7px;background:var(--sage);color:var(--panel);
  font:500 10.5px/1.3 var(--data);border-bottom:3px solid var(--ink)}
.pday.today h6{background:var(--ink);color:var(--panel)}
.pday .slots{padding:7px;display:grid;gap:5px;align-content:start}
.ev{padding:6px 7px;font:500 11px/1.35 var(--data);border-left:6px solid var(--c);
  background:var(--sunk);color:var(--mid)}
.ev.block{background:var(--panel);border:3px solid var(--ink);border-left-width:7px;
  color:var(--ink)}
.ev.block b{font-weight:500;font-size:11.5px}
/* a day column is narrow; two lines and a tooltip beats a five-line wrap */
.ev b,.ev span.tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word}
.ev .at{color:var(--mid);font-size:10.5px}
.pdrop{margin:auto 7px 8px;padding:8px;text-align:center;border:3px dashed var(--sunk);
  font:500 10.5px/1.3 var(--data);color:var(--mid)}
.pday.over .pdrop{border-color:var(--rec);color:var(--rec)}
@media (max-width:980px){
  .plan{grid-template-columns:1fr}
  .pdays{grid-template-columns:repeat(2,1fr)}
}

/* ── training ───────────────────────────────────────── */
/* the rotation, as a row of cartridges: spent, loaded, waiting */
.rot{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.rot s{text-decoration:none;padding:10px 13px 8px;background:var(--panel);
  border:3px solid var(--ink);font:700 11px/1 var(--label);letter-spacing:.11em;
  text-transform:uppercase;color:var(--mid);box-shadow:3px 3px 0 var(--sunk);cursor:pointer}
.rot s:hover{background:var(--sunk)}
.rot s.up{background:var(--ink);color:var(--panel);box-shadow:3px 3px 0 var(--rec)}
.rot s.done{background:var(--sunk);box-shadow:none;border-color:var(--mid);
  color:var(--mid);text-decoration:line-through}
.rot s b{font-weight:400;margin-left:7px;opacity:.6}

.wnow{padding:24px 26px 22px;margin-bottom:22px}
.wnow h2{font:400 clamp(26px,3.6vw,36px)/1.1 var(--display);margin:14px 0 0}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap}
.wclock{font:400 40px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.wsum{font:500 12px/1 var(--data);color:var(--mid);margin-top:9px;text-align:right}

/* ── SIGNATURE: the ledger. Last session on the left, immutable and grey;
      today's blanks on the right. The comparison is the whole point, so the
      two are never more than a rule apart. ── */
.wsheet{max-width:780px}
.ledger{display:grid;gap:10px}
.lrow{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:11px 15px 13px}
.lrow.logged{box-shadow:4px 4px 0 var(--ok)}
.lhead{display:flex;align-items:baseline;gap:11px;margin-bottom:9px}
.lhead h4{margin:0;font:400 19px/1.2 var(--display)}
.lhead .swap{margin-left:auto;flex:none}
.lbody{display:grid;grid-template-columns:172px 1fr;gap:15px;align-items:center}
.last{font:500 12.5px/1.6 var(--data);color:var(--mid);
  border-right:3px solid var(--sunk);padding-right:13px}
.last em{font-style:normal;font:700 10px/1 var(--label);letter-spacing:.13em;
  text-transform:uppercase;display:block;margin-bottom:6px;opacity:.65}
.last b{font-weight:500;color:var(--ink);letter-spacing:.03em}
.last .ago{display:block;margin-top:4px;font-size:11px;opacity:.75}
.last.none{color:var(--sage);border-right-color:var(--sage-lt)}

.sets{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sb{display:flex;align-items:center;gap:3px;background:var(--sunk);
  border:3px solid var(--ink);padding:6px 8px}
.sb input{width:44px;padding:4px 2px;text-align:center;border:0;background:transparent;
  font:500 16px/1 var(--data);color:var(--ink)}
.sb input::placeholder{color:var(--mid);opacity:.38;font-weight:400}
.sb input:focus{outline:none;background:transparent;box-shadow:none}
.sb x{font:500 12px/1 var(--data);color:var(--mid);text-decoration:none}
.sb.filled{background:var(--panel);box-shadow:2px 2px 0 var(--ink)}
/* a set that beat the last one gets the only accent on the row */
.sb.pr{border-color:var(--rec);box-shadow:2px 2px 0 var(--rec)}
.sb.pr::after{content:"\25B2";color:var(--rec);font-size:9px;margin-left:3px}
button.addset{padding:9px 11px 7px;font-size:11px;box-shadow:2px 2px 0 var(--ink);
  background:transparent;border-style:dashed}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pick{padding:15px 14px 13px;text-align:left;background:var(--panel);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;
  font:400 12px/1 var(--label);letter-spacing:.06em;text-transform:uppercase}
.pick:hover{background:var(--sunk)}
.pick b{display:block;font:400 21px/1.1 var(--display);letter-spacing:0;
  text-transform:none;margin-bottom:6px}
.pick s{text-decoration:none;color:var(--mid);font:500 11px/1.4 var(--data);
  letter-spacing:.02em;text-transform:none;display:block;margin-top:6px}

.hist{display:grid;gap:9px}
.hrow{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hrow>summary,.hrow>.hsum{padding:11px 14px;display:flex;align-items:center;gap:12px;
  list-style:none;font-size:14.5px}
.hrow>summary{cursor:pointer}
.hrow>summary:hover{background:var(--sunk)}
.hrow>summary::-webkit-details-marker{display:none}
.hrow>summary i,.hrow>.hsum i{width:9px;height:9px;background:var(--c);border:2px solid var(--ink);flex:none}
.hrow>summary .rt,.hrow>.hsum .rt{margin-left:auto;font:500 11.5px/1 var(--data);color:var(--mid);
  white-space:nowrap}
.hdet{border-top:3px solid var(--sunk);padding:11px 14px 13px;display:grid;gap:6px}
.hdet div{display:flex;gap:12px;font:500 12.5px/1.5 var(--data);color:var(--mid)}
.hdet div span{flex:1;color:var(--ink);font-weight:500}
@media (max-width:660px){
  .lbody{grid-template-columns:1fr;gap:11px}
  .last{border-right:0;border-bottom:3px solid var(--sunk);padding:0 0 10px}
  .wclock{text-align:left}
  .wsum{text-align:left}
}

/* ── modal ──────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(36,28,18,.55);display:flex;align-items:flex-start;
  justify-content:center;padding:22px;z-index:60;overflow:auto;
  background-image:radial-gradient(rgba(36,28,18,.5) 1.5px,transparent 1.5px);background-size:5px 5px}
/* margin:auto centres the window when it fits and scrolls the scrim when it doesn't,
   so no scrollbar ever cuts through the double frame */
.modal{margin:auto;padding:26px 28px 24px;width:min(540px,100%);
  animation:snap .18s steps(3,end)}
@keyframes snap{from{transform:translate(-6px,-6px)}}
.modal h2{font:400 27px/1.2 var(--display);margin:0}
label{display:block;font:700 11px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;
  color:var(--mid);margin:20px 0 8px}
label em{font-style:normal;letter-spacing:.08em}
input,textarea,select{width:100%;font:400 15px/1.5 var(--body);padding:11px 13px;
  border:3px solid var(--ink);background:var(--sunk);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;background:var(--panel);
  box-shadow:inset 0 0 0 3px var(--sunk)}
textarea{resize:vertical;min-height:70px}
/* the from/to pair, with the running duration sitting on the baseline beside it */
.span{display:flex;gap:11px;align-items:flex-end}
.span > div:not(.dur){flex:1}
.span label{margin-top:14px}
.dur{flex:0 0 auto;font:700 11px/1 var(--label);letter-spacing:.1em;
  text-transform:uppercase;color:var(--mid);padding-bottom:15px;min-width:52px}
.dur.bad{color:var(--rec)}
.hint{font-size:13.5px;color:var(--mid);margin:9px 0 0;line-height:1.5}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--panel);padding:13px 20px 11px;font:700 12px/1 var(--label);letter-spacing:.04em;
  z-index:99;max-width:min(520px,90vw);text-align:center;line-height:1.5}
.toast.bad{background:var(--rec)}
.toast button{margin-left:14px;background:var(--panel);color:var(--ink);
  border:2px solid var(--panel);box-shadow:none;padding:6px 9px 5px;font-size:10px}
.toast button:hover{background:var(--sunk);border-color:var(--sunk)}

/* entrance: one step, not a fade */
.stag{animation:up .3s steps(4,end) backwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:660px){
  .wrap{padding:0 14px 90px}
  .bar{margin:0 -14px 22px;padding:12px 14px}
  .now{padding:22px 18px}
  .clockwrap{text-align:left}
  .row{grid-template-columns:92px 1fr;gap:8px}
  .tbody{--off:100px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><p style="color:var(--mid);padding:48px 0;font-family:var(--label);font-size:12px">READING STATE…</p></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => (s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* the project .md files are markdown; render the inline bits, escaped first */
const md = s => esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
const D = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const LANE = {coursework:'--coursework',research:'--research',business:'--business',
              side:'--side',software:'--software',work:'--work'};
const DAY0 = 8, DAY1 = 23, SLOT = DAY1 - DAY0;   // one cell per hour of the envelope
/* calendar kinds: label + colour. Order here is the row order in the trace.
   A feed labelled in calendar_source.txt that isn't listed still gets a row. */
const KIND = {
  class:    ['classes',  'var(--sage)'],
  tutoring: ['tutoring', 'var(--business)'],
  plan:     ['on calendar', 'var(--ink)'],
  other:    ['calendar', 'var(--mid)'],
};
const kindMeta = k => KIND[k] || [k, 'var(--mid)'];
function kindsPresent(){
  const found = [...new Set(S.fixed.filter(f=>!f.all_day).map(f=>f.kind))];
  const known = Object.keys(KIND).filter(k=>found.includes(k));
  return known.concat(found.filter(k=>!KIND[k]));
}
let S=null, tick=null, drawerOpen=false, dragTask=null;
let T=null, wtick=null, saveTimer={}, showArch=false;
const view = () => location.hash === '#plan' ? 'plan'
                 : location.hash === '#train' ? 'train' : 'board';

const hhmm = i => new Date(i).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const dur  = m => m>=60 ? (m/60).toFixed(1)+"h" : m+"m";
const hue  = id => `var(${LANE[(S.projects.find(p=>p.id===id)||{}).lane] || '--mid'})`;
const kb   = b => b>=1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";

async function api(p,b){
  const r = await fetch(p, b?{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(b)}:undefined);
  return r.json();
}
function toast(msg,bad,action){
  $('.toast')?.remove();
  const e=document.createElement('div'); e.className='toast'+(bad?' bad':'');
  e.textContent=msg;
  if(action){
    const b=document.createElement('button');
    b.textContent=action.label;
    b.onclick=()=>{ e.remove(); action.run(); };
    e.appendChild(b);
  }
  document.body.appendChild(e);
  setTimeout(()=>e.remove(), action?9000:3400);   // longer when there's a choice
}
async function load(){
  S = await api('/api/state');
  if(S.error){ $('#app').innerHTML=`<div class="void" style="margin-top:60px"><b>State didn’t parse</b>${esc(S.error)}</div>`; return; }
  render();
}

/* which hour cells a span covers, as flat indices across the week */
function cells(iso, minutes){
  const d = new Date(iso), day = (d.getDay()+6)%7;
  const s = d.getHours()+d.getMinutes()/60, e = s + minutes/60, out = [];
  for(let h=DAY0; h<DAY1; h++) if(e>h && s<h+1) out.push(day*SLOT + (h-DAY0));
  return out;
}

/* ───────────────────────── render ───────────────────────── */
function render(){
  clearInterval(wtick);                     // the workout clock only ticks in its own view
  if(view()==='train'){ loadTrain(); return; }
  if(view()==='plan'){ renderPlan(); return; }
  const today = S.blocks.filter(b=>b.dow===S.today_dow);
  const live  = !!S.active;
  $('#app').innerHTML = `
  ${topBar(live)}
  <div class="stag">${nowPanel(today,live)}</div>
  <div class="stag" style="animation-delay:.04s">
    <h3 class="sec"><b>This week</b></h3>${trace()}
  </div>
  <div class="stag" style="animation-delay:.08s">
    <h3 class="sec"><b>Today</b></h3>
    ${today.length ? today.map(item).join("") : emptyToday()}
  </div>
  <div class="stag" style="animation-delay:.12s">
    <h3 class="sec"><b>Deadlines</b></h3>${deadlines()}
  </div>
  <div class="stag" style="animation-delay:.16s">
    <h3 class="sec"><b>Inbox</b></h3>${inbox()}
  </div>
  <div class="stag" style="animation-delay:.2s">
    <h3 class="sec"><b>Projects</b>
      <button class="secbtn" onclick="openAddProject()">+ Add project</button></h3>
    <div class="grid g2">${onBoard().map(project).join("")}</div>
    ${archivedPanel()}
  </div>
  <div class="stag" style="animation-delay:.24s">
    <h3 class="sec"><b>Streaks</b></h3><div class="grid g3">${S.habits.map(habit).join("")}${meals()}</div>
  </div>
  ${S.recent.length?`<div class="stag"><h3 class="sec"><b>Log</b></h3><div class="box card"
    style="--c:var(--ink)">${S.recent.map(logRow).join("")}</div></div>`:""}`;
  runClock(); wireDrop(); if(drawerOpen) paintDrawer();
}

const openTasks = () => (S.tasks||[]).filter(t=>t.status!=='done');

function topBar(live){
  const cal = S.calendar || {};
  const stale = cal.source !== 'demo'
    && (cal.age_minutes==null || (!cal.live && cal.age_minutes > 720));
  const demo = cal.source === 'demo';
  const calNote = demo ? 'demo calendar \u2014 sample data'
    : cal.synced ? (cal.live ? 'calendar live' : `calendar ${ago(cal.age_minutes)}`)
    : 'calendar not synced';
  return `<header class="bar">
    <div class="mark"><span class="led ${live?'on':''}"></span>COMMAND</div>
    <div class="spread"></div>
    <div class="stat ${stale?'stale':''}" title="${esc(cal.source||'')}">${calNote}</div>
    <div class="stat">${D[S.today_dow]} <b id="wall">${hhmm(S.now)}</b></div>
    <div class="stat">· <b>${S.totals.minutes?dur(S.totals.minutes):'0m'}</b> logged</div>
    <button class="sm tbtn" onclick="toggleDrawer()">Tasks${
      openTasks().length?`<s>${openTasks().length}</s>`:''}</button>
  </header>`;
}
const ago = m => m==null ? 'never synced'
  : m < 60 ? `synced ${Math.max(1,m)}m ago`
  : m < 1440 ? `synced ${Math.round(m/60)}h ago` : `synced ${Math.round(m/1440)}d ago`;

function nowPanel(today, live){
  if(live){
    const c = hue(S.active.project);
    return `<section class="window now" style="--c:${c}">
      <div class="nowtop"><div style="flex:1;min-width:250px">
        <div class="eyebrow"><span class="led on"></span>Recording</div>
        <h2>${esc(S.active.label||S.active.project)}</h2>
        ${S.active.first_action?`<div class="tape"><span class="cap">Doing</span>${md(S.active.first_action)}</div>`:""}
      </div>
      <div class="clockwrap"><div class="clock" id="run">0:00</div>
        <div class="stat" style="justify-content:flex-end">since ${hhmm(S.active.started)}</div></div></div>
      <div class="acts">
        <button class="go" onclick="finish()"><span class="dot"></span>Stop and check out</button>
        <button class="quiet" onclick="stopIt()">Discard this run</button></div></section>`;
  }
  const nx = today.find(b=>!b.done&&!b.past) || today.find(b=>!b.done);
  if(nx){
    const c = hue(nx.commitment);
    return `<section class="window now" style="--c:${c}">
      <div class="eyebrow" style="color:var(--mid)">Up next · ${hhmm(nx.start)}</div>
      <h2>${esc(nx.summary)}</h2>
      ${nx.first_action?`<div class="tape"><span class="cap">Start with</span>${md(nx.first_action)}</div>`:""}
      <div class="acts"><button class="go" onclick='go(${JSON.stringify(nx)})'>
        <span class="dot"></span>Start the clock</button></div></section>`;
  }
  /* Every live project, not the top few: the picker is also how you reach a
     project that has gone quiet, and a lane you never see is a lane you never
     work. Ones with no next step still show — they just say so. */
  const picks = onBoard();
  return `<section class="window now" style="--c:var(--research)">
    <div class="eyebrow" style="color:var(--mid)">Nothing scheduled</div>
    <h2>Pick a project and start the clock.</h2>
    <div class="acts wrap">${picks.map(p=>`<button onclick='go(${JSON.stringify(
      {commitment:p.id,summary:p.name,first_action:p.next||"",id:null})})'
      style="border-left:10px solid ${hue(p.id)}" title="${esc(p.next||'No next step yet')}">
      ${esc(p.name)}${p.next?'':'<s>no next step</s>'}</button>`).join("")}</div>
    <p class="hint">Unplanned work counts double — it tells the planner when you actually work.</p>
  </section>`;
}

/* ── the signature: one cell per hour, seven days across ── */
function trace(){
  /* an archived project still earns its row in the week it was worked in —
     hiding logged hours would make the week's record wrong, not tidier */
  const rows = S.projects.filter(p => p.minutes_this_week>0 ||
    (!p.archived && (p.hours_max>0 || S.blocks.some(b=>b.commitment===p.id))));
  const n = new Date(S.now);
  const frac = (((n.getDay()+6)%7) +
    (Math.min(DAY1,Math.max(DAY0,n.getHours()+n.getMinutes()/60))-DAY0)/SLOT) / 7;

  const paint = (lit, plan, cls) => [...Array(7)].map((_,d)=>
    `<div class="day">${[...Array(SLOT)].map((_,h)=>{
      const i = d*SLOT+h, hit = lit[i];
      if(cls[i]) return `<s class="cls" title="${esc(cls[i])}"></s>`;
      if(hit) return `<s class="on" style="opacity:${hit.o}" title="${esc(hit.t)}"></s>`;
      if(plan[i]) return `<s class="plan" title="${esc(plan[i])}"></s>`;
      return `<s></s>`;
    }).join("")}</div>`).join("");

  /* calendar events, one reference row per kind, so tutoring reads separately */
  const refRow = kind => {
    const [label, color] = kindMeta(kind);
    const map = {};
    S.fixed.filter(f=>f.kind===kind && !f.all_day).forEach(f =>
      cells(f.start,(new Date(f.end)-new Date(f.start))/60000).forEach(i =>
        map[i] = f.label + (f.location?` · ${f.location}`:'')));
    if(!Object.keys(map).length) return "";
    return `<div class="row fixed"><div class="nm" style="--c:${color}"><i></i>${label}</div>
      <div class="week" style="--c:${color}">${paint({}, {}, map)}</div></div>`;
  };

  return `<div class="box trace" onclick="if(!event.target.closest('a'))location.hash='#plan'"
    title="Open the planner" style="cursor:pointer"><div class="tbody">
    <div class="row"><span></span><div class="dayhdr">
      ${D.map((d,i)=>`<span class="${i===S.today_dow?'td':''}">${d}</span>`).join("")}</div></div>

    ${kindsPresent().map(refRow).join("")}

    ${rows.map(p=>{
      const c = hue(p.id), lit = {}, plan = {};
      S.week_sessions.filter(s=>s.project===p.id).forEach(s=>{
        const o = s.focus ? (0.4 + s.focus*0.12).toFixed(2) : 0.8;
        cells(s.start,s.minutes).forEach(i=>{
          if(!lit[i] || lit[i].o < o)
            lit[i] = {o, t:`${s.did||p.name} · ${dur(s.minutes)}${s.focus?` · focus ${s.focus}/5`:''}`};
        });
      });
      S.blocks.filter(b=>b.commitment===p.id&&!b.done).forEach(b=>
        cells(b.start,b.minutes).forEach(i=>plan[i] = `planned · ${b.first_action||b.summary}`));
      return `<div class="row ${p.minutes_this_week?'live':''}">
        <div class="nm" style="--c:${c}"><i></i>${esc(p.id)}</div>
        <div class="week" style="--c:${c}">${paint(lit, plan, {})}</div></div>`;
    }).join("")}
    <div class="head" style="left:calc(var(--off) + (100% - var(--off)) * ${frac.toFixed(4)})"></div>
  </div>
  <div class="legend">
    <b><i></i>logged — solid means high focus</b>
    <b><i class="p"></i>queued, not on the calendar</b>
    ${kindsPresent().map(k=>`<b><i style="background:${kindMeta(k)[1]}"></i>${
      kindMeta(k)[0]}</b>`).join("")}
    <b><i class="n"></i>now</b>
    <b style="margin-left:auto">one cell = one hour · ${DAY0}:00–${DAY1}:00 ·
      <a href="#plan" style="color:var(--rec)">open planner</a></b>
  </div></div>`;
}

function item(b){
  return `<div class="box item ${b.done?'done':''}" style="--c:${hue(b.commitment)}">
    <div class="tm">${hhmm(b.start)}</div>
    <div style="flex:1"><div class="it">${esc(b.summary)}</div>
      ${b.first_action?`<div class="ia">${md(b.first_action)}</div>`:""}</div>
    ${b.done?`<span class="tag" style="color:var(--ok)">done</span>`
      :`<button class="sm" onclick='go(${JSON.stringify(b)})'>Start</button>`}</div>`;
}
function emptyToday(){
  return `<div class="void"><b>No blocks today.</b>
    Drop a syllabus in the inbox below and run <code>/intake</code> — it files the document,
    pulls out every due date, and lays work backward from each one. Until then, start any
    project below; the clock still runs.</div>`;
}

/* ── inbox: the cartridge slot ── */
function inbox(){
  const q = S.inbox || [];
  return `<div id="dropwrap">
    <button type="button" class="drop" id="drop">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M10 2h4v8h4l-6 7-6-7h4z"></path>
        <path fill="currentColor" d="M2 19h20v3H2z"></path></svg>
      <strong>Drop a syllabus, assignment, or spec here</strong>
      <span>Or click to choose a file · PDF, Word, slides, images, text</span>
    </button>
    <input type="file" id="picker" multiple hidden>
    ${q.length?`<div class="queue">${q.map(f=>`<div class="file">
      <span class="fn">${esc(f.name)}</span>
      <span class="fs">${kb(f.size)}</span>
      <button class="sm quiet" onclick="unqueue('${esc(f.name).replace(/'/g,"\\'")}')">Remove</button>
    </div>`).join("")}</div>
    <p class="note">${q.length} file${q.length>1?'s':''} waiting in <code>.agent/inbox/</code>.
      Run <code>/intake</code> in Claude Code to file each one and turn its dates into blocks.</p>`
    :`<p class="note">Files land in <code>.agent/inbox/</code>. Nothing reads them until you
      run <code>/intake</code> in Claude Code.</p>`}
  </div>`;
}
function wireDrop(){
  const zone = $('#drop'), picker = $('#picker');
  if(!zone) return;
  zone.onclick = () => picker.click();
  picker.onchange = () => { send([...picker.files]); picker.value=""; };
  let depth = 0;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    stop(e); if(ev==='dragenter') depth++; zone.classList.add('hot');
  }));
  zone.addEventListener('dragleave', e => { stop(e); if(--depth<=0) zone.classList.remove('hot'); });
  zone.addEventListener('drop', e => {
    stop(e); depth=0; zone.classList.remove('hot');
    send([...(e.dataTransfer?.files||[])]);
  });
}
/* a file dropped outside the zone would otherwise navigate away from the page.
   Bound once — wireDrop() runs on every render. */
['dragover','drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
async function send(files){
  if(!files.length) return;
  let ok = 0, last = "";
  for(const f of files){
    const b64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(String(r.result).split(',')[1]);
      r.onerror = rej; r.readAsDataURL(f);
    });
    const r = await api('/api/inbox',{name:f.name,data:b64});
    if(r.ok){ ok++; last = r.message; } else toast(`${f.name}: ${r.message}`, true);
  }
  if(ok) toast(ok===1 ? last : `${ok} files are in the inbox`);
  load();
}
async function unqueue(name){
  const r = await api('/api/inbox/remove',{name});
  toast(r.ok ? r.message : r.message, !r.ok);

}

function taskRow(t){
  const done = t.status==='done';
  const chips = [];
  if(t.est_minutes) chips.push(`<span class="chip">${dur(t.est_minutes)}</span>`);
  if(t.due){
    const n = Math.floor(t.days_left);
    chips.push(`<span class="chip ${n<1?'hot':n<3?'due':''}">${
      n<0?'overdue':n===0?'due today':`due ${new Date(t.due).toLocaleDateString([],
        {weekday:'short',month:'numeric',day:'numeric'})}`}</span>`);
  }
  if(t.status==='scheduled') chips.push(`<span class="chip sch">${
    (t.blocks||[]).length} block${(t.blocks||[]).length===1?'':'s'} queued</span>`);
  return `<div class="task ${done?'gone':''}" draggable="${!done}" data-task="${t.id}">
    <button class="tick" aria-pressed="${done}" title="${done?'Reopen':'Tick off'}"
      onclick="tickTask('${t.id}',${done})">${done?'x':''}</button>
    <div style="flex:1;min-width:0">
      <div class="tt">${esc(t.title)}</div>
      ${t.first_action?`<div class="tfa">${md(t.first_action)}</div>`:
        `<div class="tfa" style="color:var(--rec)">No first action — add one to schedule it</div>`}
      ${chips.length?`<div class="chips">${chips.join("")}</div>`:""}
    </div>
    <button class="tdel" title="Delete" onclick="delTask(this,'${t.id}')">\u2715</button>
  </div>`;
}

let showDone = false;
function taskGroups(list){
  const live = list.filter(t=>t.status!=='done');
  const done = list.filter(t=>t.status==='done');
  const earlier = S.tasks_done_earlier || 0;

  const groups = () => {
    if(!live.length) return `<div class="void" style="box-shadow:none"><b>Nothing open.</b>
      ${done.length?'Everything on this week\u2019s list is ticked off.'
        :'Add a task below, or let <code>/intake</code> make them from a syllabus.'}</div>`;
    const by = {};
    live.forEach(t => (by[t.project] = by[t.project] || []).push(t));
    return Object.entries(by).map(([pid,ts])=>{
      const p = S.projects.find(x=>x.id===pid) || {name:pid};
      return `<div class="tgroup">
        <h5 style="--c:${hue(pid)}"><i></i>${esc(p.name)}<b>${ts.length} open</b></h5>
        ${ts.map(taskRow).join("")}</div>`;
    }).join("");
  };

  /* Finished work is worth seeing — but not above the work that isn't done. */
  const doneSection = () => {
    if(!done.length && !earlier) return "";
    return `<button class="donehdr" onclick="showDone=!showDone;paintTasks()">
        ${showDone?'\u25be':'\u25b8'} Completed \u00b7 ${done.length} this week
        <s>${earlier?`+${earlier} earlier`:''}</s></button>
      ${showDone ? (done.length ? done.map(taskRow).join("")
        : `<div class="void" style="box-shadow:none">Nothing finished yet this week.
           ${earlier} older task${earlier===1?'':'s'} \u2014 see them with
           <code>task.py list --all</code>.</div>`) : ""}`;
  };
  return groups() + doneSection();
}

/* Two clicks to delete. One stray click used to be enough to lose a task, and
   this table is the only record that the work exists. */
async function delTask(btn, id){
  if(btn.dataset.armed !== '1'){
    document.querySelectorAll('.tdel.armed').forEach(disarm);
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = 'Delete?';
    btn.dataset.timer = setTimeout(()=>disarm(btn), 4000);
    return;
  }
  disarm(btn);
  const r = await api('/api/task',{op:'delete', id});
  if(!r.ok){ toast(r.message, true); return; }
  toast("Task deleted.", false, {label:'Undo', run:()=>undoDelete(id)});
  load();
}
async function undoDelete(id){
  const r = await api('/api/task',{op:'restore', id});
  toast(r.ok ? "Task restored." : r.message, !r.ok);
  load();
}
function disarm(btn){
  clearTimeout(btn.dataset.timer);
  btn.dataset.armed = '0';
  btn.classList.remove('armed');
  btn.textContent = '\u2715';
}

/* ── drag a task onto a day ── */
function wireDrag(){
  document.querySelectorAll('.task[draggable=true]').forEach(el=>{
    el.ondragstart = e => {
      dragTask = el.dataset.task;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragTask);
    };
    el.ondragend = () => { dragTask = null; el.classList.remove('dragging'); };
  });
}
function wirePlanDrop(){
  document.querySelectorAll('.pday').forEach(day=>{
    day.ondragover = e => { if(dragTask){ e.preventDefault(); day.classList.add('over'); } };
    day.ondragleave = () => day.classList.remove('over');
    day.ondrop = async e => {
      e.preventDefault(); day.classList.remove('over');
      const id = dragTask || e.dataTransfer.getData('text/plain');
      dragTask = null;
      if(!id) return;
      const r = await api('/api/schedule',{task:id, date:day.dataset.date});
      toast(r.message, !r.ok);
      load();
    };
  });
}

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'').replace(/^-+|-+$/g,'');

/* ═══════════════════════ training ═══════════════════════
   One comparison carries this view: what you lifted last time on this
   exercise, printed beside today's blanks. Beat it and the box marks itself.
   Everything else — rotation, history, cardio — stays quiet around that.
   ═══════════════════════════════════════════════════════ */
const splitById = id => (T.splits||[]).find(s=>s.id===id);
const fmtSet = (s,bw) => bw||!s.weight ? `×${s.reps}` : `${+s.weight}×${s.reps}`;
const lbs = n => Math.round(n).toLocaleString() + " lb";
function daysAgo(iso){
  const d = Math.floor((Date.now()-new Date(iso))/86400000);
  return d<=0 ? "today" : d===1 ? "yesterday" : `${d} days ago`;
}
/* heaviest set of a session, ties broken on reps — the number to beat */
function best(sets){
  let w=0, r=0;
  (sets||[]).forEach(s=>{ const a=+(s.weight||0), b=+(s.reps||0);
    if(a>w || (a===w && b>r)){ w=a; r=b; } });
  return {w,r};
}
function beats(s, last, bw){
  if(!s.reps || !last) return false;
  const b = best(last.sets);
  return bw ? +s.reps > b.r
            : +(s.weight||0) > b.w || (+(s.weight||0) === b.w && +s.reps > b.r);
}

  renderTrain();
}

/* template rows resolved against whichever side of an either/or slot is chosen */
function activeRows(){
  const sp = splitById((T.active||{}).split);
  if(!sp) return [];
  const sw = (T.active.swaps)||{};
  return sp.exercises.map(ex => {
    const swapped = ex.or && sw[ex.id] === ex.or.id;
    const {or, ...plain} = ex;
    return swapped ? {...ex.or, slot:ex.id, alt:plain} : {...plain, slot:ex.id, alt:ex.or||null};
  });
}
function rowSets(row){
  const rec = ((T.active||{}).exercises||{})[row.id];
  const have = (rec&&rec.sets)||[];
  const n = Math.max(row.sets||2, have.length);
  return [...Array(n)].map((_,i)=> have[i] || {weight:null, reps:null});
}
function sumLine(){
  const ex = Object.values(((T.active||{}).exercises)||{});
  const n = ex.reduce((a,e)=>a+((e.sets||[]).filter(s=>s.reps).length),0);
  const v = ex.reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(+(s.weight||0))*(+(s.reps||0)),0),0);
  return `${n} set${n===1?'':'s'}` + (v?` · ${lbs(v)} moved`:'');
}

function renderTrain(){
  const w = T.week||{}, g = w.gym||{}, c = w.cardio||{};
  $('#app').innerHTML = `
  <div class="pbar">
    <a class="btn sm" href="#">← Board</a>
    <h1>Training</h1>
    <div class="spread" style="flex:1"></div>
    <div class="stat">gym <b>${g.count||0}/${g.target||0}</b></div>
    <div class="stat">· cardio <b>${c.count||0}/${c.target||0}</b></div>
  </div>
  ${T.active ? activeView() : idleView()}
  ${historyView()}`;
  wireSets(); runWClock();
}

/* ── nothing in progress: pick the day ── */
function idleView(){
  const done = T.week_splits||[];
  const strip = (T.rotation||[]).map(id=>{
    const sp = splitById(id) || {id, name:id};
    const cls = id===T.next ? 'up' : done.includes(id) ? 'done' : '';
    return `<s class="${cls}" onclick="startSplit('${id}')">${esc(sp.name)}</s>`;
  }).join("");

  const nx = splitById(T.next);
  const others = (T.splits||[]).filter(s=>s.id!==T.next);
  const head = nx ? `
    <div class="box wnow" style="--c:var(--software)">
      <div class="wtop">
        <div>
          <div class="eyebrow">up next</div>
          <h2>${esc(nx.name)}</h2>
          <div class="wsum" style="text-align:left">${nx.exercises.length} exercises ·
            ${nx.exercises.reduce((a,e)=>a+(e.sets||2),0)} sets</div>
        </div>
        <div><button class="go" onclick="startSplit('${nx.id}')"><span class="dot"></span>
          Start ${esc(nx.name)}</button></div>
      </div>
    </div>` : `<div class="void"><b>No rotation yet.</b>
      Add splits to <code>workouts.yaml</code> and they show up here.</div>`;

  return `
  <div class="rot">${strip}</div>
  ${head}
  <h3 class="sec"><b>Or another day</b></h3>
  <div class="pickgrid">${others.map(sp=>`
    <button class="pick" onclick="startSplit('${sp.id}')"><b>${esc(sp.name)}</b>
      <s>${sp.exercises.length} exercises</s></button>`).join("")}</div>
  <h3 class="sec"><b>Cardio</b></h3>
  <div class="pickgrid">${(T.cardio||[]).map(a=>`
    <button class="pick" onclick="logCardio('${a.id}','${esc(a.name)}',${a.default_minutes||0})">
      <b>${esc(a.name)}</b><s>${a.default_minutes?a.default_minutes+' min by default':'log it'}</s>
    </button>`).join("")}</div>`;
}

/* ── in progress: the ledger ── */
function activeView(){
  const sp = splitById(T.active.split) || {name:T.active.split};
  return `<div class="wsheet">
  <div class="box wnow" style="--c:var(--software)">
    <div class="wtop">
      <div>
        <div class="eyebrow"><span class="led on"></span> in progress</div>
        <h2>${esc(sp.name)}</h2>
      </div>
      <div>
        <div class="wclock" id="wclock">0:00</div>
        <div class="wsum" id="wsum">${sumLine()}</div>
      </div>
    </div>
    <div class="acts">
      <button class="go" onclick="finishWorkout()"><span class="dot"></span>Finish workout</button>
      <button class="sm quiet" onclick="discardWorkout(this)">Discard</button>
    </div>
  </div>
  <div class="ledger">${activeRows().map(ledgerRow).join("")}</div></div>`;
}

function ledgerRow(row){
  const bw = row.unit==='bw', last = row.last, sets = rowSets(row);
  return `<div class="lrow ${sets.some(s=>s.reps)?'logged':''}"
    data-ex="${row.id}" data-slot="${row.slot}" data-unit="${row.unit}">
    <div class="lhead"><h4>${esc(row.name)}</h4>
      ${row.alt?`<button class="sm quiet swap"
        onclick="swapSlot('${row.slot}','${row.alt.id}')">or ${esc(row.alt.name)}</button>`:''}
    </div>
    <div class="lbody">
      <div class="last ${last?'':'none'}">
        ${last ? `<em>last time</em><b>${last.sets.map(s=>fmtSet(s,bw)).join(" ")}</b>
                  <span class="ago">${daysAgo(last.ts)}</span>`
               : `first time — set the baseline`}</div>
      <div class="sets">
        ${sets.map((s,i)=>setBox(s,i,bw,last)).join("")}
        <button class="addset" onclick="addSet('${row.id}')">+ set</button>
      </div>
    </div></div>`;
}
function setBox(s,i,bw,last){
  const b = best(last&&last.sets), filled = !!s.reps;
  return `<label class="sb ${filled?'filled':''} ${filled&&beats(s,last,bw)?'pr':''}" data-i="${i}">
    ${bw?'':`<input class="w" inputmode="decimal" aria-label="weight"
      placeholder="${b.w||''}" value="${s.weight??''}">`}
    <x>×</x>
    <input class="r" inputmode="numeric" aria-label="reps"
      placeholder="${b.r||''}" value="${s.reps??''}">
  </label>`;
}

function wireSets(){
  document.querySelectorAll('.lrow').forEach(el=>{
    el.querySelectorAll('.sb input').forEach(inp=>{
      inp.oninput = () => onSetInput(el);
      inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); focusNext(inp); } };
    });
  });
}
function readRow(el){
  return [...el.querySelectorAll('.sb')].map(b=>{
    const w = b.querySelector('.w'), r = b.querySelector('.r');
    return {weight: w && w.value.trim() ? w.value.trim() : null,
            reps:   r && r.value.trim() ? r.value.trim() : null};
  });
}
/* repainting the row would steal focus mid-number, so typing only touches the
   classes that change and the running total. The save is debounced behind it. */
function onSetInput(el){
  const eid = el.dataset.ex, unit = el.dataset.unit, bw = unit==='bw';
  const sets = readRow(el);
  T.active.exercises = T.active.exercises || {};
  T.active.exercises[eid] = {unit, sets};
  const row = activeRows().find(r=>r.id===eid);
  [...el.querySelectorAll('.sb')].forEach((b,i)=>{
    b.classList.toggle('filled', !!sets[i].reps);
    b.classList.toggle('pr', !!sets[i].reps && beats(sets[i], row&&row.last, bw));
  });
  el.classList.toggle('logged', sets.some(s=>s.reps));
  const sum = $('#wsum'); if(sum) sum.textContent = sumLine();
  clearTimeout(saveTimer[eid]);
  saveTimer[eid] = setTimeout(()=>
    api('/api/workout',{op:'sets', exercise:eid, unit, sets}), 500);
}
function focusNext(inp){
  const all = [...document.querySelectorAll('.lrow .sb input')];
  const i = all.indexOf(inp);
  if(i>=0 && i<all.length-1) all[i+1].focus(); else inp.blur();
}
function addSet(eid){
  const row = activeRows().find(r=>r.id===eid);
  T.active.exercises = T.active.exercises || {};
  T.active.exercises[eid] = {unit: row.unit, sets: [...rowSets(row), {weight:null,reps:null}]};
  const el = document.querySelector(`.lrow[data-ex="${eid}"]`);
  el.outerHTML = ledgerRow(activeRows().find(r=>r.id===eid));
  wireSets();
  const boxes = document.querySelectorAll(`.lrow[data-ex="${eid}"] .sb`);
  const box = boxes[boxes.length-1];
  (box.querySelector('.w') || box.querySelector('.r')).focus();
}

async function startSplit(id){
  const r = await api('/api/workout',{op:'start', split:id});
  if(!r.ok){ toast(r.message, true); return; }
  loadTrain();
}
async function swapSlot(slot, exercise){
  const r = await api('/api/workout',{op:'swap', slot, exercise});
  if(!r.ok){ toast(r.message, true); return; }
  loadTrain();
}
function discardWorkout(btn){
  if(btn.dataset.armed !== '1'){
    btn.dataset.armed = '1'; btn.textContent = 'Discard — sure?';
    setTimeout(()=>{ btn.dataset.armed=''; btn.textContent='Discard'; }, 4000);
    return;
  }
  api('/api/workout',{op:'discard'}).then(r=>{ toast(r.message, !r.ok); loadTrain(); });
}
async function finishWorkout(){
  Object.values(saveTimer).forEach(clearTimeout);
  const ex = (T.active||{}).exercises || {};
  const n = Object.values(ex).reduce((a,e)=>a+(e.sets||[]).filter(s=>s.reps).length, 0);
  if(!n){ toast("Nothing logged yet — record a set first.", true); return; }
  /* the whole map travels with the request so a debounced save can't be lost */
  const r = await api('/api/workout',{op:'finish', exercises:ex});
  toast(r.ok ? r.message.replace('logged: ','Logged ') : r.message, !r.ok);
  if(r.ok) loadTrain();
}
async function logCardio(id, name, mins){
  const v = await ask(name, "How long?", mins ? `${mins} minutes` : "minutes");
  if(v===null) return;
  const minutes = parseInt(v,10) || mins || null;
  const r = await api('/api/cardio',{activity:id, minutes});
  toast(r.ok ? r.message.replace('logged: ','Logged ') : r.message, !r.ok);
  if(r.ok) loadTrain();
}
function runWClock(){
  clearInterval(wtick);
  const el = $('#wclock');
  if(!el || !T.active || !T.active.started) return;
  const start = new Date(T.active.started);
  const paint = () => {
    const s = Math.max(0, Math.floor((Date.now()-start)/1000));
    el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  };
  paint(); wtick = setInterval(paint, 1000);
}

function historyView(){
  if(!(T.recent||[]).length) return `<h3 class="sec"><b>Recent</b></h3>
    <div class="void"><b>No sessions yet.</b>Start a split above. What you record lands
    here, and in the streak pips on the board — it is all one log.</div>`;
  return `<h3 class="sec"><b>Recent</b></h3>
    <div class="hist">${T.recent.map(histRow).join("")}</div>`;
}
function histRow(e){
  const c = e.kind==='gym' ? 'var(--software)' : 'var(--side)';
  const meta = [e.when, e.minutes?dur(e.minutes):null, e.volume?lbs(e.volume):null]
    .filter(Boolean).join(" · ");
  const head = `<i style="background:${c}"></i><span>${esc(e.detail)}</span>
    <span class="rt">${meta}</span>`;
  if(!(e.exercises||[]).length) return `<div class="hrow"><div class="hsum">${head}</div></div>`;
  return `<details class="hrow"><summary>${head}</summary>
    <div class="hdet">${e.exercises.map(x=>
      `<div><span>${esc(x.name)}</span>${x.sets.map(st=>
        fmtSet(st, x.unit==='bw')).join(" ")}</div>`).join("")}</div></details>`;
}

/* ───────────────────────── actions ───────────────────────── */
function runClock(){
  clearInterval(tick);
  const paint = ()=>{
    const w = $('#wall'); if(w) w.textContent = hhmm(new Date().toISOString());
    if(!S.active) return;
    const el = $('#run'); if(!el) return;
    const s = Math.max(0,(Date.now()-new Date(S.active.started))/1000);
    el.textContent = `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  };
  paint(); tick = setInterval(paint,1000);
}
async function go(b){
  await api('/api/start',{project:b.commitment,block_id:b.id,label:b.summary,first_action:b.first_action});
  await load(); window.scrollTo({top:0,behavior:'smooth'});
}
async function stopIt(){ await api('/api/stop',{}); await load(); }
function finish(){
  const m = Math.max(1,Math.round((Date.now()-new Date(S.active.started))/60000));
  openCheckout(S.active.project, m, S.active.block_id);
}
async function saveNext(el){
  const id = el.dataset.p, text = el.textContent.trim();
  const p = S.projects.find(x=>x.id===id);
  if(!p || text === (p.next||"")) return;
  const r = await api('/api/next',{project:id,next:text});
  toast(r.ok?"Next step saved":"Didn’t save: "+r.message, !r.ok);
  if(r.ok) p.next = text;
}

/* a one-field window, so nothing here uses a blocking browser dialog */
function ask(title, label, placeholder){
  return new Promise(res=>{
    const s = document.createElement('div');
    s.className = 'scrim';
    const close = v => { s.remove(); res(v); };
    s.onclick = e => { if(e.target===s) close(null); };
    s.innerHTML = `<div class="window modal"><h2>${esc(title)}</h2>
      <label>${esc(label)}</label><input id="ask-in" placeholder="${esc(placeholder)}">
      <div class="acts" style="margin-top:22px">
        <button class="go" id="ask-ok">Log it</button>
        <button class="quiet" id="ask-no">Cancel</button></div></div>`;
    document.body.appendChild(s);
    const input = $('#ask-in', s);
    $('#ask-ok',s).onclick = () => close(input.value.trim());
    $('#ask-no',s).onclick = () => close(null);
    input.onkeydown = e => { if(e.key==='Enter') close(input.value.trim()); };
    setTimeout(()=>input.focus(),40);
  });
}
async function quick(kind){
  let detail="", who="";
  if(kind==='meal'){
    const w = await ask("Log a meal","Eating with anyone?","Leave blank for solo");
    if(w===null) return;
    who = w; detail = w ? "meal with "+w : "meal";
  } else if(kind==='social'){
    const d = await ask("Something social","What was it?","Dinner, climbing, a call…");
    if(d===null || !d) return;
    detail = d;
  } else {
    const d = await ask(`Log ${kind}`, kind==='gym'?"What did you train?":"What cardio?",
      kind==='gym'?"Push, pull, legs…":"5k, bike, stairs…");
    if(d===null || !d) return;
    detail = d;
  }
  const r = await api('/api/life',{kind,detail,with:who});
  toast(r.ok?r.message.replace("logged: ","Logged "):("Didn’t log: "+r.message), !r.ok);
  load();
}

/* ── checkout ── */
/* The span, not a duration. Defaults to a sensible window ending now, so the
   common case (log what you just did) is two edits, and backdating to Tuesday
   3-5pm is three. */
function openCheckout(project, minutes, blockId){
  const cur = S.projects.find(p=>p.id===project);
  const end = new Date();
  const start = new Date(end - (minutes||50)*60000);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${
    String(d.getDate()).padStart(2,'0')}`;
  const clock = d => `${String(d.getHours()).padStart(2,'0')}:${
    String(d.getMinutes()).padStart(2,'0')}`;
  const s = document.createElement('div');
  s.className='scrim'; s.onclick = e => { if(e.target===s) s.remove(); };
  s.innerHTML = `<div class="window modal">
    <h2>Check out</h2>
    <p class="hint">When you worked, and a next step you could start without thinking.</p>
    <label>Project</label>
    <select id="c-proj">${S.projects.filter(p=>!p.archived||p.id===project).map(p=>
      `<option value="${p.id}"${p.id===project?' selected':''}>${esc(p.name)}</option>`).join("")}</select>
    <label>Day</label>
    <input id="c-date" type="date" value="${iso(start)}" max="${iso(new Date())}">
    <div class="span">
      <div><label>From</label><input id="c-from" type="time" value="${clock(start)}"></div>
      <div><label>To</label><input id="c-to" type="time" value="${clock(end)}"></div>
      <div class="dur" id="c-dur"></div>
    </div>
    <label>What changed?</label>
    <textarea id="c-did" placeholder="Something concrete — not &quot;worked on it&quot;"></textarea>
    <label>Next step</label>
    <textarea id="c-next" placeholder="The first action for next time">${esc(cur?cur.next:"")}</textarea>
    <p class="hint">This becomes the opening line of your next block on this project.</p>
    <label>Blockers <em>optional, comma-separated</em></label><input id="c-block">
    <div class="acts" style="margin-top:26px">
      <button class="go" onclick="save('${blockId||""}')">Save</button>
      <button class="quiet" onclick="this.closest('.scrim').remove()">Cancel</button></div></div>`;
  document.body.appendChild(s);
  ['#c-date','#c-from','#c-to'].forEach(sel => $(sel).oninput = span);
  span();
  setTimeout(()=>$('#c-did').focus(),50);
}

/* Reads the three fields as one span. Returns null when they don't make sense,
   and says why in the line under the times rather than at save time. */
function span(){
  const out = $('#c-dur'); if(!out) return null;
  const d = $('#c-date').value, a = $('#c-from').value, b = $('#c-to').value;
  if(!(d && a && b)){ out.textContent=''; out.className='dur'; return null; }
  const from = new Date(`${d}T${a}`), to = new Date(`${d}T${b}`);
  const mins = Math.round((to - from)/60000);
  if(mins <= 0){
    out.textContent = 'ends before it starts'; out.className='dur bad'; return null; }
  if(mins > 720){
    out.textContent = 'over 12 hours — check the times'; out.className='dur bad'; return null; }
  out.textContent = dur(mins); out.className='dur';
  return {started_at:`${d}T${a}:00`, ended_at:`${d}T${b}:00`, minutes:mins};
}

async function save(blockId){
  const next = $('#c-next').value.trim();
  if(!next){ toast("Needs a next step — it’s the cold-start opener.",true); $('#c-next').focus(); return; }
  const when = span();
  if(!when){ toast("Check the day and times.",true); $('#c-from').focus(); return; }
  const r = await api('/api/checkout',{
    project:$('#c-proj').value,
    started_at:when.started_at, ended_at:when.ended_at,
    did:$('#c-did').value.trim(), next,
    blockers:$('#c-block').value.trim(), block_id:blockId||null});
  if(!r.ok){ toast("Rejected: "+r.message,true); return; }
  $('.scrim')?.remove(); toast("Logged — queued for Claude Plan."); load();
}

addEventListener('hashchange', () => { closeDrawer(); if(S) render(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('.scrim')) $('.scrim').remove(); else closeDrawer(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)
    || e.target.isContentEditable;
  if(!typing && !$('.scrim') && (e.key==='t'||e.key==='T')){ e.preventDefault(); toggleDrawer(); }
});
load();
setInterval(()=>{
  const busy = $('.scrim') || document.activeElement.isContentEditable
    || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
    || $('#drop')?.classList.contains('hot') || dragTask;
  if(!busy) load();
}, 60000);
</script>
